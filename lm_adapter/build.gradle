apply plugin: 'com.android.library'

android {
    namespace "com.anythink.custom.adapter"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    // The TopOn/Taku SDK is provided by the host app at runtime. The AdbidAdx SDK
    // (adbid_sdk.aar) implements all its behavior through the merged manifest below and
    // is pulled in by the host app when it depends on this module. The adapter only needs
    // their APIs at compile time, so declare them compileOnly and never bundle them into
    // the produced AAR.
    compileOnly files('libs/anythink_core-api.jar')
    compileOnly files('libs/adbid_sdk_2.1.0.24_0923_1850.aar')
}