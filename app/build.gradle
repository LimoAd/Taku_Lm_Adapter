apply plugin: 'com.android.application'

apply from: 'taku.gradle'

android {
    compileSdkVersion 34
    namespace "com.anythink.sdk.demo"
    defaultConfig {
        applicationId "com.anythink.sdk.demo"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled = true
        // AdbidAdx SDK providers/activities are referenced from the merged manifest and are
        // loaded at startup before the app classloader can reach secondary dex files, so they
        // must live in the main dex to avoid ClassNotFoundException at install time.
        multiDexKeepFile file('multidex-config.txt')
    }
    signingConfigs {
        demo {
            keyAlias 'anythink'
            keyPassword '123456'
            storeFile file('anythink.jks')
            storePassword '123456'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.demo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories{
    maven { url 'https://jitpack.io' }
}

// taku.gradle declares the old com.android.support:appcompat-v7:28.0.0, which Jetifier
// rewrites to androidx.appcompat. Pin a single consistent androidx version to avoid
// strict-constraint conflicts between taku.gradle, material and the SDK aars.
configurations.all {
    resolutionStrategy {
        force 'androidx.appcompat:appcompat:1.4.2'
        force 'androidx.recyclerview:recyclerview:1.2.1'
        force 'androidx.fragment:fragment:1.4.1'
    }
}

dependencies {
    compileOnly 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.DingMouRen:LayoutManagerGroup:1e6f4f96eb'

    implementation 'com.anythink.sdk:debugger-ui:1.1.2'
    // ---------- Taku / TopOn 聚合核心（AnyThink SDK，中介层）----------
    implementation files('libs/anythink_core_6.5.73.aar')                                // 聚合核心 SDK
    implementation files('libs/util-1.1.3.aar')                                           // 工具库
    implementation files('libs/anythink_adx_sdk_kuying_6.5.68_necessary.aar')             // Taku ADX SDK
    implementation files('libs/anythink_network_adx_kuying_sdk_necessary_6.5.68.1.1.aar') // Taku ADX 网络适配

    // ---------- AdbidAdx（LM 网络；经自定义适配器 lm_adapter 接入）----------
    implementation files('libs/adbid_sdk_2.1.0.24_0923_1850.aar')                        // AdbidAdx SDK
    implementation project(':lm_adapter')

    // ---------- 腾讯优量汇（GDT）----------
    implementation files('libs/union-4.671.1541.aar')
    implementation project(':adapter')

}
